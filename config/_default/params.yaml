# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: indigo

# SEO
marketing:
  seo:
    default_image: 'media/icon.png'
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Academic profile and research portfolio of Rumana L'
    twitter: 'GetResearchDev'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    block: 'navbar'
    fixed_to_top: true
    show_search: false
    show_theme_chooser: true
    logo:
      image: 'media/logo-light.png'
      image_dark: 'media/logo-dark.png'
# Site footer
footer:
  enable: false
  # copyright:
  #   notice: '© {year} Rumana Lakdawala.'
  #   license:
  #     enable: true
  #     allow_derivatives: false
  #     share_alike: false
  #     allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
