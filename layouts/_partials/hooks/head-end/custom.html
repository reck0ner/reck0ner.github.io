  }
</style>

<style>
  /* translucent navbar — light mode */
  div.page-header.sticky {
    background-color: rgba(255, 255, 255, 0.6) !important;

</style>

<style>
  /* translucent navbar — dark mode */
  html.dark div.page-header.sticky {

</style>

<style>
  /* translucent navbar — light mode */
  .page-header.sticky {
    background-color: rgba(255, 255, 255, 0.55) !important;
    backdrop-filter: blur(12px);

  }

  /* translucent navbar — dark mode */

<style>

/* disable ALL links inside publication list items */
.blox-item a {
  pointer-events: none !important;
  cursor: default !important;
  text-decoration: none !important;
  color: inherit !important;
}

/* if the wrapper itself is a link */
.blox-item {
  pointer-events: none !important;
}

/* but allow buttons or icons to still work*/
.blox-item .btn,
.blox-item .btn a {
  pointer-events: auto !important;
}

</style>


<style>
/* hide the site title text */
.navbar-brand {
  font-size: 0 !important;
}

/* show your logo instead of text */

/* hide the text */
.navbar-brand {
  font-size: 0 !important;
}

/* default = light mode */
html:not(.dark) .navbar-brand::before {
  content: "";
  display: inline-block;
  height: 32px;
  width: 32px;
  background-image: url('/media/logo-light.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

/* dark mode */
html.dark .navbar-brand::before {
  content: "";
  display: inline-block;
  height: 32px;
  width: 32px;
  background-image: url('/media/logo-dark.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

</style>

<style>

/* make the gradient background fill the entire page */
html, body {
  min-height: 100vh;
  height: auto;
  background: inherit !important; /* inherit gradient from main hero section */
}

/* extend the main gradient class to body */
.hbx-bg-gradient,
body {
  background-size: cover !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
}

/* remove the black footer wrapper */
.page-footer,
.page-footer-wrapper,
#page-footer {
  display: none !important;
  height: 0 !important;
  padding: 0 !important;
  margin: 0 !important;
}

</style>
