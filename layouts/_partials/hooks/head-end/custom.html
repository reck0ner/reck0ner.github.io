<!--- change navbar colour --->
<style>

/* Base navbar (light mode) */
.page-header.sticky.top-0 {
  background: rgba(255, 255, 255, 0.55) !important;
  backdrop-filter: blur(12px) !important;
  -webkit-backdrop-filter: blur(12px) !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.25) !important;
}

/* Dark mode navbar */
html.dark .page-header.sticky.top-0 {
  background: rgba(20, 20, 20, 0.55) !important;
  backdrop-filter: blur(12px) !important;
  -webkit-backdrop-filter: blur(12px) !important;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
}

/* Move nav menu to the right */
.page-header.sticky.top-0 #nav-menu {
  margin-left: auto !important;
}

/* Remove all other conflicting backgrounds */
#site-header,
.page-header,
nav.navbar {
  background: none !important;
  border: none !important;
}

</style>



<!--- fix publications linking to stuff --->
<style>

/* disable all auto-generated publication links */
.blox-item a {
  pointer-events: none !important;
  text-decoration: none !important;
  color: inherit !important;
  cursor: default !important;
}

/* prevent the entire publication card from being clickable */
.blox-item {
  pointer-events: none !important;
}

/* allow buttons/icons inside publications to still work normally */
.blox-item .btn,
.blox-item .btn a {
  pointer-events: auto !important;
}

/* remove hover underline (safety) */
.blox-item a:hover {
  text-decoration: none !important;
}

</style>



<!--- show logo instead of text on navbar --->
<style>
/* hide the site title text */
.navbar-brand {
  font-size: 0 !important;
}

/* hide the text */
.navbar-brand {
  font-size: 0 !important;
}

/* default = light mode */
html:not(.dark) .navbar-brand::before {
  content: "";
  display: inline-block;
  height: 32px;
  width: 32px;
  background-image: url('/media/logo-light.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

/* dark mode */
html.dark .navbar-brand::before {
  content: "";
  display: inline-block;
  height: 32px;
  width: 32px;
  background-image: url('/media/logo-dark.png');
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

</style>


<!--- bg--->

<style>
/* make the gradient background fill the entire page */
html, body {
  min-height: 100vh;
  height: auto;
  background: inherit !important; /* inherit gradient from main hero section */
}

/* extend the main gradient class to body */
.hbx-bg-gradient,
body {
  background-size: cover !important;
  background-repeat: no-repeat !important;
  background-attachment: fixed !important;
}

/* remove the black footer wrapper */
.page-footer,
.page-footer-wrapper,
#page-footer {
  display: none !important;
  height: 0 !important;
  padding: 0 !important;
  margin: 0 !important;
}

</style>
